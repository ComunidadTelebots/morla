<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesion - TPV Morla</title>
  <link rel="stylesheet" href="/tpv/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <div class="auth-form">
      <a class="brand auth-brand" href="../index.html">
        <span class="brand-mark">M</span>
        <span>
          <strong>TPV Morla</strong>
          <small>Acceso privado</small>
        </span>
      </a>
      <div>
        <p class="eyebrow">Inicio de sesion</p>
        <h1>Entra con tu usuario</h1>
      </div>

      <div class="login-tabs" role="group" aria-label="Tipo de acceso">
        <button class="login-tab is-active" data-login-tab="server" type="button">Servidor</button>
        <button class="login-tab" data-login-tab="local" type="button">Local</button>
      </div>

      <form id="serverForm" class="login-inner-form" method="post" action="/login">
        <label>
          Usuario
          <input name="username" type="text" autocomplete="username" required />
        </label>
        <label>
          Contrasena
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <p class="auth-error" id="authError" hidden>Usuario o contrasena incorrectos.</p>
        <button class="pay-button" type="submit">Entrar</button>
      </form>

      <form id="localForm" class="login-inner-form" hidden>
        <label>
          Usuario
          <input name="username" type="text" autocomplete="username" required />
        </label>
        <label>
          Contrasena
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <p class="auth-error" id="localError" hidden>Usuario o contrasena incorrectos.</p>
        <button class="pay-button" type="submit">Entrar sin conexion</button>
      </form>
    </div>
  </main>
  <script src="/tpv/login.js"></script>
</body>
</html>
