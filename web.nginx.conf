server {
  listen 80;
  server_name morladelavalderia.es www.morladelavalderia.es morladelavalderia.duckdns.org;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location ^~ /tpv {
    return 301 https://tpv.morladelavalderia.es/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
